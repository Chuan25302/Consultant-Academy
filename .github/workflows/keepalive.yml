name: Keepalive

# Why this exists:
# GitHub auto-disables scheduled (cron) workflows in PUBLIC repos after 60
# days with no new commit. Only real commits reset that timer — merged PRs,
# tags, and issues do NOT count. The Daily Routine writes to Google Drive and
# GitHub Pages but never commits to git, so the repo goes "inactive" and the
# schedule gets silently disabled (which is exactly what happened on
# 2026-07-16, 60 days after the last human commit on 2026-05-16).
#
# This job runs weekly, and ONLY when the newest commit is >= 40 days old it
# pushes a single empty commit — resetting the 60-day timer for every
# scheduled workflow in the repo (including this one) while keeping git
# history almost noise-free (~1 commit every ~40-50 days).

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday 10:00 Bangkok (UTC+7)
  workflow_dispatch:       # Allow a manual "am I working?" test run

permissions:
  contents: write          # Repo default is read-only; this job must push.

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Push an empty commit if the repo has been quiet >= 40 days
        run: |
          last_commit_epoch=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last_commit_epoch ) / 86400 ))
          echo "Days since last commit: $age_days"
          if [ "$age_days" -lt 40 ]; then
            echo "Repo committed recently — no keepalive commit needed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore(keepalive): reset 60-day scheduled-workflow inactivity timer"
          git push
          echo "Pushed keepalive commit."
